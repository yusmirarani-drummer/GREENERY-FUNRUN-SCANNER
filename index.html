<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
GREENERY FUN RUN SCANNER
</title>

<link rel="stylesheet"
      href="style.css">


<!-- =====================================
     QR CODE LIBRARY
===================================== -->

<script
src="https://unpkg.com/html5-qrcode"
type="text/javascript">
</script>

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<h2>

🌿 GREENERY FUN RUN

<br>

QR SCANNER

</h2>


<!-- =====================================
     CREW & KAUNTER
===================================== -->

<div class="settings-card">

<h3>
⚙️ Tetapan Crew
</h3>


<label for="crew">
Crew
</label>


<select id="crew">

<option value="Crew A">
Crew A
</option>

<option value="Crew B">
Crew B
</option>

<option value="Crew C">
Crew C
</option>

<option value="Crew D">
Crew D
</option>

</select>


<br><br>


<label for="kaunter">
Kaunter
</label>


<select id="kaunter">

<option value="Kaunter 1">
Kaunter 1
</option>

<option value="Kaunter 2">
Kaunter 2
</option>

<option value="Kaunter 3">
Kaunter 3
</option>

<option value="Kaunter 4">
Kaunter 4
</option>

</select>


</div>


<!-- =====================================
     QR SCANNER
===================================== -->

<div id="reader"></div>


<!-- =====================================
     RESULT MESSAGE
===================================== -->

<div id="result"></div>


<!-- =====================================
     PARTICIPANT INFORMATION
===================================== -->

<div id="info"
     class="card"
     style="display:none;">


<h3>
Maklumat Peserta
</h3>


<p>

Nama:
<br>

<b id="nama"></b>

</p>


<p>

Bib:
<br>

<b id="bib"></b>

</p>


<p>

IC:
<br>

<b id="ic"></b>

</p>


<p>

Saiz:
<br>

<b id="saiz"></b>

</p>


<p>

Bayaran:
<br>

<b id="bayaran"></b>

</p>


<p>

Status:
<br>

<b id="status"></b>

</p>


<!-- =====================================
     CHECK-IN BUTTON
===================================== -->

<button
id="checkInButton"
onclick="checkIn()">

✅ CHECK-IN + AMBIL KIT

</button>


<!-- =====================================
     SCAN NEXT BUTTON
===================================== -->

<button
id="nextButton"
onclick="scanNext()"
style="display:none;">

📷 SCAN PESERTA SETERUSNYA

</button>


</div>


<!-- =====================================
     APPLICATION JAVASCRIPT
===================================== -->

<script src="app.js"></script>


</body>

</html>
