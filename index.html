<!DOCTYPE html>
<html>

<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
GREENERY FUN RUN SCANNER
</title>


<link rel="stylesheet"
      href="style.css">


<!-- =====================================
     HTML5 QR CODE LIBRARY
===================================== -->

<script
src="https://unpkg.com/html5-qrcode"
type="text/javascript">
</script>


</head>


<body>


<h2>
🌿 GREENERY FUN RUN
<br>
QR SCANNER
</h2>


<!-- =====================================
     QR SCANNER
===================================== -->

<div id="reader"></div>


<!-- =====================================
     RESULT MESSAGE
===================================== -->

<div id="result"></div>


<!-- =====================================
     PARTICIPANT INFORMATION
===================================== -->

<div id="info"
     class="card"
     style="display:none;">


<h3>
Maklumat Peserta
</h3>


<p>

Nama:
<br>

<b id="nama"></b>

</p>


<p>

Bib:
<br>

<b id="bib"></b>

</p>


<p>

IC:
<br>

<b id="ic"></b>

</p>


<p>

Saiz:
<br>

<b id="saiz"></b>

</p>


<p>

Bayaran:
<br>

<b id="bayaran"></b>

</p>


<p>

Status:
<br>

<b id="status"></b>

</p>


<button
onclick="checkIn()">

✅ CHECK-IN + AMBIL KIT

</button>


</div>


<!-- =====================================
     APPLICATION JAVASCRIPT
===================================== -->

<script src="app.js"></script>


</body>

</html>
